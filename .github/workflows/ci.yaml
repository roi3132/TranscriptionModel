name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: transcription_test
          POSTGRES_USER: transcription_test
          POSTGRES_PASSWORD: transcription_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transcription_test -d transcription_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://transcription_test:transcription_test@localhost:5432/transcription_test
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Verify lockfile, formatting, lint, typing, and tests
        run: make check test

      - name: Verify Linux inference sandbox restrictions
        run: uv run --frozen python tests/sandbox_probe.py

      - name: Build the distributable wheel
        run: make package

      - name: Check frontend syntax
        run: node --check src/transcription_service/static/assets/app.js

  docker:
    name: Docker build and startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: transcription-ci
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build the application image
        run: docker compose build

      - name: Start services and wait for readiness
        run: docker compose up --no-build -d --wait --wait-timeout 120

      - name: Verify published API and browser interface
        run: |
          curl --fail --show-error --max-time 10 http://localhost:8000/health/ready
          curl --fail --show-error --max-time 10 --output /dev/null http://localhost:8000/
          curl --fail --show-error --max-time 10 --output /dev/null http://localhost:8000/assets/app.js

      - name: Print container status and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200

      - name: Stop services and remove CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
