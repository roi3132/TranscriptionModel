[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcription-service"
version = "0.1.0"
description = "A production-minded media transcription service built with FastAPI and Whisper."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # faster-whisper 1.2.1 passes metadata_errors, which PyAV 19 removed.
  "av>=14,<19",
  "fastapi>=0.115,<1",
  "faster-whisper>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<8",
  "structlog>=24.4,<27",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transcription_service"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["transcription_service"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
