name: transcription-tests

# Disposable infrastructure for adapter tests; separate from application data.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transcription_test
      POSTGRES_USER: transcription_test
      POSTGRES_PASSWORD: transcription_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcription_test -d transcription_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
